
name: Build Sarthak Study Point APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract source ZIP
        run: |
          unzip -q Sarthak_Study_Point_Source.zip -d source
          test -f source/sarthak_study_point/pubspec.yaml
          test -f source/sarthak_study_point/lib/main.dart

      - name: Create Android project
        run: |
          flutter create --platforms=android --org com.sarthakstudypoint --project-name sarthak_study_point app
          cp source/sarthak_study_point/pubspec.yaml app/pubspec.yaml
          cp -r source/sarthak_study_point/lib/. app/lib/
          
      

      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          
      - name: Set Android compile SDK
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' app/android/app/build.gradle.kts
          grep -n "compileSdk" app/android/app/build.gradle.kts
          

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Build APK
        working-directory: app
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sarthak-Study-Point-APK
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          
