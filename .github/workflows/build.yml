name: Build Sarthak Study Point APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK packages
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Extract Android project
        run: |
          unzip -q Sarthak_Study_Point_V26_All_Exams_CBT_Admin_Control.zip -d unpacked
          test -f unpacked/SarthakStudyPointAndroid/settings.gradle

      - name: Build debug APK
        working-directory: unpacked/SarthakStudyPointAndroid
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sarthak-Study-Point-APK
          path: unpacked/SarthakStudyPointAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
